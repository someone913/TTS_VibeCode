<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - TTS Indonesia</title>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem("tts_theme");
                const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                const theme = saved || (prefersDark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/style.css?v=2.2">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1 class="auth-brand">TTS Indonesia</h1>
            <p class="auth-subtitle">Daftarkan akun pemain baru untuk menyimpan skor & rekor peringkat.</p>

            <div id="auth-error" class="alert alert-error hidden"></div>
            <div id="auth-success" class="alert alert-success hidden"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="username">Nama Pengguna Baru</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Pilih nama unik (min. 3 karakter)" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Masukkan kata sandi (min. 6 karakter)" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Konfirmasi Kata Sandi</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Ulangi kata sandi di atas" required autocomplete="new-password">
                </div>

                <button type="submit" id="register-submit-btn" class="btn-primary">Daftar Akun Baru</button>
            </form>

            <div class="auth-footer">
                Sudah memiliki akun? <a href="/login">Masuk sekarang</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
